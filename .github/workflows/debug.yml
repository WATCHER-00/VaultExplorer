name: Build Unsigned APK (arm64)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/build
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build Debug-Signed APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android NDK r28c
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Copy checkout to reproducible BUILD_DIR
        run: |
          rm -rf "${{ env.BUILD_DIR }}"
          mkdir -p "$(dirname "${{ env.BUILD_DIR }}")"
          cp -a "$GITHUB_WORKSPACE" "${{ env.BUILD_DIR }}"

      - name: Resolve dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          export PUB_CACHE="${{ env.BUILD_DIR }}/.pub-cache"
          .flutter/bin/flutter config --no-analytics
          .flutter/bin/flutter pub get

      - name: Build release APK (arm64, debug-signed)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          export PUB_CACHE="${{ env.BUILD_DIR }}/.pub-cache"
          BASE_VERSION_CODE=$(grep '^version:' pubspec.yaml | sed -n 's/.*+\([0-9]*\)/\1/p')
          VERSION_CODE=$(( BASE_VERSION_CODE * 100 + 3 ))

          .flutter/bin/flutter build apk --release \
            --target-platform=android-arm64 \
            --build-number=$VERSION_CODE

      - name: Prepare APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d'+' -f1)
          mkdir -p release-apk
          cp "build/app/outputs/flutter-apk/app-release.apk" \
             "release-apk/VaultExplorer-v${VERSION}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultExplorer-arm64-APK
          path: ${{ env.BUILD_DIR }}/release-apk/*.apk
          retention-days: 30